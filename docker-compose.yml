version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=xtenant_core
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pass
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=docker-secret
      - DJANGO_DEBUG=1
      - CORE_DB_ENGINE=django.db.backends.postgresql
      - CORE_DB_NAME=xtenant_core
      - CORE_DB_USER=postgres
      - CORE_DB_PASSWORD=postgres_pass
      - CORE_DB_HOST=db
      - CORE_DB_PORT=5432
      - TENANT_DB_ENGINE=django.db.backends.postgresql
      - TENANT_DB_USER=postgres
      - TENANT_DB_PASSWORD=postgres_pass
      - TENANT_DB_HOST=db
      - TENANT_DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: